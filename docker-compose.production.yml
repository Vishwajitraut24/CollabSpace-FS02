services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: collabspace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your production environment file}
      POSTGRES_DB: collabspace
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collabspace -d collabspace"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in your production environment file}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]

  migrate:
    build:
      context: .
      dockerfile: apps/collaboration-server/Dockerfile
      target: migrate
    restart: "no"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://collabspace:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your production environment file}@postgres:5432/collabspace?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]

  api:
    build:
      context: .
      dockerfile: apps/collaboration-server/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: postgresql://collabspace:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your production environment file}@postgres:5432/collabspace?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your production environment file}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in your production environment file}@redis:6379
      WEB_ORIGIN: https://${DOMAIN:?Set DOMAIN in your production environment file}
      TRUST_PROXY: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [private]

  collab:
    build:
      context: .
      dockerfile: apps/collaboration-server/Dockerfile
      target: runtime
    command: ["node", "apps/collaboration-server/dist/collab.js"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      COLLAB_PORT: 4001
      DATABASE_URL: postgresql://collabspace:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your production environment file}@postgres:5432/collabspace?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your production environment file}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in your production environment file}@redis:6379
    volumes:
      - collaboration_data:/app/.collab-data
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4001/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [private]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAIN:?Set DOMAIN in your production environment file}/api
        NEXT_PUBLIC_COLLAB_URL: wss://${DOMAIN:?Set DOMAIN in your production environment file}/collab
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      collab:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [private]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in your production environment file}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks: [private]

networks:
  private:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  collaboration_data:
  caddy_data:
  caddy_config:
